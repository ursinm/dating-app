<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очистка данных</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 15px;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .secondary-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .secondary-btn:hover {
            background: #f3f4f6;
        }
        
        .info {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 8px;
        }
        
        .info-title {
            font-weight: 600;
            color: #0369a1;
            margin-bottom: 8px;
        }
        
        .info-text {
            font-size: 14px;
            color: #0c4a6e;
            margin: 0;
        }
        
        .success {
            background: #f0fdf4;
            border-left-color: #22c55e;
        }
        
        .success .info-title {
            color: #16a34a;
        }
        
        .success .info-text {
            color: #15803d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔄</div>
        <h1>Очистка данных</h1>
        <p>После миграции на email необходимо очистить старые данные из localStorage</p>
        
        <div class="info">
            <div class="info-title">📝 Что произойдёт:</div>
            <p class="info-text">
                • Все старые данные будут удалены<br>
                • Вы будете перенаправлены на страницу входа<br>
                • Нужно будет зарегистрироваться заново с email
            </p>
        </div>
        
        <button onclick="clearStorage()">🗑️ Очистить данные</button>
        <button class="secondary-btn" onclick="goHome()">← Вернуться на главную</button>
        
        <div id="result" style="display: none;"></div>
    </div>
    
    <script>
        function clearStorage() {
            try {
                // Очищаем localStorage
                localStorage.clear();
                
                // Показываем успешное сообщение
                const result = document.getElementById('result');
                result.innerHTML = `
                    <div class="info success">
                        <div class="info-title">✅ Данные очищены!</div>
                        <p class="info-text">
                            Перенаправление через 2 секунды...
                        </p>
                    </div>
                `;
                result.style.display = 'block';
                
                // Перенаправляем на главную через 2 секунды
                setTimeout(() => {
                    window.location.href = '/welcome';
                }, 2000);
            } catch (error) {
                alert('Ошибка при очистке: ' + error.message);
            }
        }
        
        function goHome() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
