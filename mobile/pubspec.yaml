name: dating_app
description: Dating application built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.9

  # State Management
  flutter_riverpod: ^2.6.1
  provider: ^6.1.5+1

  # Dependency Injection
  get_it: ^7.7.0

  # UI Components
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.2
  google_fonts: ^6.3.2
  flutter_card_swiper: ^7.1.0

  # Navigation
  go_router: ^13.2.5

  # Image & Media
  image_picker: ^1.2.0
  audioplayers: ^5.2.1
  record: ^6.1.2

  # Utilities
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  timeago: ^3.7.1
  uuid: ^4.5.1
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

